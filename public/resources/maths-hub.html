<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Explorer Hub — All Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF5E9;
    --paper-dot: rgba(33,48,74,0.10);
    --ink: #21304A;
    --ink-soft: #5A6580;
    --card: #FFFFFF;
    --card-border: #E4D9BF;
    --gold: #D9A22B;
    --gold-ink: #55400A;
    --teal: #167A67;
    --teal-tint: #E3F3EE;
    --raspberry: #C23B56;
    --raspberry-tint: #FBEAEE;
    --sky: #3F6FB0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171B26; --paper-dot: rgba(241,236,221,0.08); --ink: #F1ECDD; --ink-soft: #B9BFCF;
      --card: #212636; --card-border: #333B52; --gold: #E7B84B; --gold-ink: #2A2109;
      --teal: #2FBF9E; --teal-tint: #16302B; --raspberry: #E06481; --raspberry-tint: #35202A; --sky: #6C9BE0;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171B26; --paper-dot: rgba(241,236,221,0.08); --ink: #F1ECDD; --ink-soft: #B9BFCF;
    --card: #212636; --card-border: #333B52; --gold: #E7B84B; --gold-ink: #2A2109;
    --teal: #2FBF9E; --teal-tint: #16302B; --raspberry: #E06481; --raspberry-tint: #35202A; --sky: #6C9BE0;
  }
  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh; background-color: var(--paper);
    background-image: radial-gradient(var(--paper-dot) 1.4px, transparent 1.4px);
    background-size: 22px 22px; color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif; line-height: 1.55;
  }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .app { max-width: 820px; margin: 0 auto; padding: 26px 18px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { font-size: 28px; transform: rotate(-8deg); display: inline-block; }
  .brand h1 { font-size: 19px; line-height: 1.15; }
  .topbar-actions { display: flex; gap: 8px; }
  .ghost-btn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    background: transparent; border: 1.5px solid var(--card-border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap;
  }
  .ghost-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
  .ghost-btn:focus-visible, .primary-btn:focus-visible, .choice-btn:focus-visible, .chapter-card:focus-visible {
    outline: 3px solid var(--sky); outline-offset: 2px;
  }
  .primary-btn {
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold-ink);
    background: var(--gold); border: none; border-radius: 8px; padding: 12px 22px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15); transform: rotate(-0.3deg); transition: transform 0.12s ease;
  }
  .primary-btn:hover { transform: rotate(-0.3deg) translateY(-1px); }
  .primary-btn:active { transform: rotate(-0.3deg) translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .primary-btn:disabled { opacity: 0.5; cursor: default; }

  .dash-header {
    background: var(--card); border: 1.5px solid var(--card-border); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .dash-header .stat-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .dash-header .stat-big { font-size: 22px; font-weight: 700; }
  .dash-header .stat-sub { font-size: 13px; color: var(--ink-soft); }
  .progress-outer { width: 100%; height: 10px; background: var(--card-border); border-radius: 99px; overflow: hidden; }
  .progress-inner { height: 100%; background: var(--gold); transition: width 0.4s ease; }

  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .chapter-card {
    background: var(--card); border: 1.5px solid var(--card-border); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left;
    font-family: 'Inter', sans-serif;
  }
  .chapter-card:hover { border-color: var(--sky); }
  .chapter-card .card-top { display: flex; align-items: center; justify-content: space-between; }
  .num-chip {
    width: 24px; height: 24px; border-radius: 50%; background: var(--sky); color: #fff;
    font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .chapter-card .emoji { font-size: 20px; }
  .chapter-card h3 { font-size: 14.5px; line-height: 1.3; margin-top: 2px; }
  .stars-mini { font-size: 13px; letter-spacing: 1px; color: var(--gold); }
  .status-tag { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); text-transform: none; }
  .status-tag.completed { color: var(--teal); }
  .status-tag.progress { color: var(--gold-ink); }

  .back-link { background: none; border: none; color: var(--sky); font-weight: 700; font-size: 13.5px; cursor: pointer; padding: 0; margin-bottom: 12px; }

  .mini-dots { display: flex; gap: 6px; margin: 2px 0 14px; }
  .mini-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--card-border); }
  .mini-dot.active { background: var(--gold); }
  .mini-dot.done { background: var(--teal); }

  .station-card, .intro-card, .summary-card {
    background: var(--card); border: 1.5px solid var(--card-border); border-radius: 10px;
    padding: 24px 22px 22px; box-shadow: 0 10px 26px rgba(33,48,74,0.08); transform: rotate(0.15deg);
  }
  .kicker { font-size: 12.5px; font-weight: 700; color: var(--sky); margin: 0 0 6px; }
  .station-card h2, .summary-card h2, .intro-card h2 { font-size: 22px; margin-bottom: 8px; }
  .prompt { color: var(--ink); font-weight: 500; margin: 6px 0 0; max-width: 60ch; }
  .visual { margin: 14px 0 4px; display: flex; justify-content: center; }

  .seq-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .num-box {
    min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--sky); border-radius: 8px; font-weight: 700; font-size: 16px;
    background: rgba(63,111,176,0.06);
  }
  .num-box.blank { border-style: dashed; border-color: var(--gold); background: rgba(217,162,43,0.12); color: var(--gold-ink); }

  .reference-row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 4px; }
  .tower { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tower-dots { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .dot-row { display: flex; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--raspberry); }
  .tower-label { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }

  .big-number, .big-letter { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 700; text-align: center; padding: 6px 0; }
  .data-list { font-size: 17px; font-weight: 600; text-align: center; padding: 8px 0; }

  .bar-svg { width: 220px; height: 140px; }
  .rect-svg { width: 150px; height: 110px; }
  .angle-svg { width: 140px; height: 120px; }
  .frac-svg { width: 190px; height: 54px; }
  .poly-svg { width: 90px; height: 90px; }

  .choice-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; justify-content: center; }
  .choice-btn {
    font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 600; background: var(--card);
    border: 2px solid var(--card-border); border-radius: 9px; padding: 10px 16px;
    display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink);
  }
  .choice-btn:hover { border-color: var(--sky); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.correct { border-color: var(--teal); background: var(--teal-tint); }
  .choice-btn.incorrect { border-color: var(--raspberry); background: var(--raspberry-tint); }

  .number-input-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  .number-input-row input {
    font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600; width: 110px; padding: 10px 12px;
    border: 2px solid var(--card-border); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  .number-input-row input:focus { border-color: var(--sky); outline: none; }

  .hint-row { margin-top: 16px; text-align: center; }
  .hint-box { margin-top: 10px; background: rgba(217,162,43,0.12); border-left: 3px solid var(--gold); padding: 10px 14px; border-radius: 6px; font-size: 14px; text-align: left; }
  .hint-box p { margin: 4px 0; }

  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 8px; font-size: 14.5px; }
  .feedback.correct { background: var(--teal-tint); border: 1.5px solid var(--teal); }
  .feedback.incorrect { background: var(--raspberry-tint); border: 1.5px solid var(--raspberry); }
  .fb-title { font-weight: 700; margin-bottom: 4px; font-size: 15px; }
  .feedback.correct .fb-title { color: var(--teal); }
  .feedback.incorrect .fb-title { color: var(--raspberry); }
  .fb-explain { color: var(--ink-soft); margin-top: 6px; }
  .stars { font-size: 16px; letter-spacing: 2px; margin-top: 4px; }

  .nav-row { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .recap-item { border: 1.5px solid var(--card-border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .recap-item .q-prompt { font-weight: 600; margin-bottom: 4px; }

  .summary-list { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .summary-list li { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; border: 1.5px solid var(--card-border); border-radius: 8px; font-size: 14px; font-weight: 600; }
  .summary-total { margin-top: 12px; font-size: 19px; font-weight: 700; }

  .foot { text-align: center; margin-top: 30px; }
  .foot p { font-size: 12px; color: var(--ink-soft); }

  .confetti-piece { position: fixed; top: -10px; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; z-index: 50; animation: fall 1100ms ease-in forwards; }
  @keyframes fall { to { transform: translateY(70vh) rotate(300deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .confetti-piece { display: none; }
    .primary-btn, .primary-btn:hover, .primary-btn:active { transform: none; }
  }
  @media (max-width: 480px) {
    .app { padding: 16px 12px 40px; }
    .brand h1 { font-size: 16px; }
    .station-card, .intro-card, .summary-card { padding: 18px 15px; }
    .dashboard-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">📘</span>
      <h1>Maths Explorer Hub<br>All 10 Chapters</h1>
    </div>
    <div class="topbar-actions">
      <button class="ghost-btn" id="homeBtn">🏠 Dashboard</button>
      <button class="ghost-btn" id="resetBtn">Reset progress</button>
    </div>
  </header>

  <main id="main"></main>

  <footer class="foot">
    <p>Original practice activities covering all 10 Class VI Maths chapters — not reproduced from any textbook.</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var CHAPTERS_META = [
    { title: "Patterns in Mathematics", emoji: "🔎" },
    { title: "Lines and Angles", emoji: "📐" },
    { title: "Number Play", emoji: "🔢" },
    { title: "Data Handling and Presentation", emoji: "📊" },
    { title: "Prime Time", emoji: "🧮" },
    { title: "Perimeter and Area", emoji: "📏" },
    { title: "Fractions", emoji: "🍰" },
    { title: "Playing with Constructions", emoji: "✏️" },
    { title: "Symmetry", emoji: "🦋" },
    { title: "The Other Side of Zero", emoji: "🌡️" }
  ];
  var LP_USER = null, LP_TOKEN = null, LP_ROLE = null;
  try { LP_USER = localStorage.getItem("lp_user"); LP_TOKEN = localStorage.getItem("lp_token"); LP_ROLE = localStorage.getItem("lp_role"); } catch (e) {}
  var STORAGE_KEY = "mathsExplorerHub_v1" + (LP_USER ? "_" + LP_USER : "");

  // Send each solved question to the portal so parents and teachers can see it (students only).
  function reportPractice(chIdx, qi, stars) {
    if (!LP_TOKEN || LP_ROLE !== "student") return;
    try {
      fetch("/api/progress/practice", {
        method: "POST",
        headers: { "content-type": "application/json", "authorization": "Bearer " + LP_TOKEN },
        body: JSON.stringify({ course: "maths", chapter: chIdx + 1, q: qi, stars: stars })
      }).catch(function () {});
    } catch (e) {}
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function seqBoxesHTML(seq) {
    return '<div class="seq-row">' + seq.map(function (v) {
      return v === null ? '<div class="num-box blank">?</div>' : '<div class="num-box">' + v + '</div>';
    }).join('') + '</div>';
  }
  function dotTriangleHTML(rows, label) {
    var rowsHtml = '';
    for (var r = 1; r <= rows; r++) {
      var dots = ''; for (var d = 0; d < r; d++) { dots += '<span class="dot"></span>'; }
      rowsHtml += '<div class="dot-row">' + dots + '</div>';
    }
    return '<div class="tower"><div class="tower-dots">' + rowsHtml + '</div><div class="tower-label">' + label + '</div></div>';
  }
  function angleSVG(deg, color) {
    var vx = 20, vy = 100, len = 80;
    var rad = deg * Math.PI / 180;
    var x2 = vx + len * Math.cos(rad), y2 = vy - len * Math.sin(rad);
    var arcR = 22, ax1 = vx + arcR, ay1 = vy;
    var ax2 = vx + arcR * Math.cos(rad), ay2 = vy - arcR * Math.sin(rad);
    var largeArc = deg > 180 ? 1 : 0;
    var path = 'M ' + ax1 + ' ' + ay1 + ' A ' + arcR + ' ' + arcR + ' 0 ' + largeArc + ' 1 ' + ax2 + ' ' + ay2;
    return '<svg viewBox="0 0 140 120" class="angle-svg" aria-hidden="true">' +
      '<line x1="' + vx + '" y1="' + vy + '" x2="' + (vx + len) + '" y2="' + vy + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
      '<line x1="' + vx + '" y1="' + vy + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>' +
      '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2" opacity="0.6"/>' +
      '<circle cx="' + vx + '" cy="' + vy + '" r="3" fill="' + color + '"/></svg>';
  }
  function linesSVG(type, color) {
    if (type === 'parallel') return '<svg viewBox="0 0 140 100" class="angle-svg"><line x1="10" y1="30" x2="130" y2="30" stroke="' + color + '" stroke-width="4"/><line x1="10" y1="70" x2="130" y2="70" stroke="' + color + '" stroke-width="4"/></svg>';
    if (type === 'perpendicular') return '<svg viewBox="0 0 140 100" class="angle-svg"><line x1="20" y1="85" x2="20" y2="10" stroke="' + color + '" stroke-width="4"/><line x1="20" y1="85" x2="120" y2="85" stroke="' + color + '" stroke-width="4"/><rect x="20" y="72" width="13" height="13" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
    return '<svg viewBox="0 0 140 100" class="angle-svg"><line x1="10" y1="15" x2="120" y2="85" stroke="' + color + '" stroke-width="4"/><line x1="15" y1="85" x2="125" y2="15" stroke="' + color + '" stroke-width="4"/></svg>';
  }
  function barChartSVG(labels, values, colors2) {
    var w = 220, h = 140, padBottom = 22, padTop = 14, barGap = 12;
    var max = Math.max.apply(null, values), n = values.length;
    var barW = (w - (n + 1) * barGap) / n, bars = '', labelsHtml = '';
    for (var i = 0; i < n; i++) {
      var barH = (values[i] / max) * (h - padBottom - padTop);
      var x = barGap + i * (barW + barGap), y = h - padBottom - barH;
      bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" fill="' + colors2[i % colors2.length] + '" rx="3"/>';
      bars += '<text x="' + (x + barW / 2) + '" y="' + (y - 4) + '" font-size="10" text-anchor="middle" fill="' + "#5A6580" + '">' + values[i] + '</text>';
      labelsHtml += '<text x="' + (x + barW / 2) + '" y="' + (h - 6) + '" font-size="9" text-anchor="middle" fill="' + "#5A6580" + '">' + labels[i] + '</text>';
    }
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="bar-svg">' + bars + labelsHtml + '</svg>';
  }
  function fractionBarSVG(total, shaded, color) {
    var w = 180, h = 50, segW = w / total, rects = '';
    for (var i = 0; i < total; i++) {
      var filled = i < shaded;
      rects += '<rect x="' + (i * segW) + '" y="0" width="' + segW + '" height="' + h + '" fill="' + (filled ? color : 'transparent') + '" fill-opacity="' + (filled ? 0.55 : 0) + '" stroke="' + color + '" stroke-width="2"/>';
    }
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="frac-svg">' + rects + '</svg>';
  }
  function polygonSVG(n, color) {
    var cx = 60, cy = 60, r = 44, pts = [];
    for (var i = 0; i < n; i++) {
      var angle = (Math.PI * 2 * i) / n - Math.PI / 2;
      pts.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
    }
    return '<svg viewBox="0 0 120 120" class="poly-svg" aria-hidden="true"><polygon points="' + pts.join(' ') + '" fill="' + color + '" fill-opacity="0.18" stroke="' + color + '" stroke-width="4" stroke-linejoin="round"/></svg>';
  }
  function rectSVG(l, w, color) {
    var maxDim = Math.max(l, w), scale = 90 / maxDim, rw = l * scale, rh = w * scale;
    var W = 150, H = 110, x = (W - rw) / 2, y = (H - rh) / 2 - 6;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="rect-svg" aria-hidden="true">' +
      '<rect x="' + x + '" y="' + y + '" width="' + rw + '" height="' + rh + '" fill="' + color + '" fill-opacity="0.15" stroke="' + color + '" stroke-width="3"/>' +
      '<text x="' + (x + rw / 2) + '" y="' + (y + rh + 16) + '" font-size="11" text-anchor="middle" fill="#5A6580">' + l + ' cm</text>' +
      '<text x="' + (x - 8) + '" y="' + (y + rh / 2) + '" font-size="11" text-anchor="end" fill="#5A6580" transform="rotate(-90 ' + (x - 8) + ' ' + (y + rh / 2) + ')">' + w + ' cm</text></svg>';
  }
  function isPrime(n) { if (n < 2) return false; for (var i = 2; i * i <= n; i++) { if (n % i === 0) return false; } return true; }

  // ---------- question generators ----------
  function genPatternsSeq() {
    var pool = [
      { seq: [2,5,8,11,null,17], answer: 14, hints: ["Compare each number to the one before it — what's added each time?","Every number is 3 more than the last: 2→5→8→11→?→17."], explain: "Arithmetic pattern with common difference 3, so the missing number is 11 + 3 = 14." },
      { seq: [50,45,40,null,30,25], answer: 35, hints: ["This sequence goes down — by how much each time?","Each number is 5 less than the one before it."], explain: "Each term decreases by 5, so after 40 comes 40 − 5 = 35." },
      { seq: [1,2,4,8,null,32], answer: 16, hints: ["Try doubling instead of adding a fixed amount.","Each number is double the one before it."], explain: "Each term is multiplied by 2: 1, 2, 4, 8, 16, 32." },
      { seq: [3,6,9,null,15,18], answer: 12, hints: ["This one follows a familiar times table.","Every number is 3 more than the last — the 3 times table!"], explain: "These are multiples of 3: 3, 6, 9, 12, 15, 18." }
    ];
    var q = pick(pool);
    return { visualHTML: seqBoxesHTML(q.seq), prompt: "Figure out the rule, then type the missing number.", type: "number", answer: q.answer, hints: q.hints, explain: q.explain };
  }
  function genPatternsTriangle() {
    var n = randInt(4, 7), answer = (n * (n + 1)) / 2, prevTotal = ((n - 1) * n) / 2;
    var ref = '<div class="reference-row">' + dotTriangleHTML(1, "Tower 1 = 1 dot") + dotTriangleHTML(2, "Tower 2 = 3 dots") + dotTriangleHTML(3, "Tower 3 = 6 dots") + '</div>';
    return { visualHTML: ref, prompt: "If the pattern continues, how many dots would Tower " + n + " have in total?", type: "number", answer: answer,
      hints: ["Each new tower adds one more row than the tower before it — how many dots in row " + n + " alone?", "Tower " + (n - 1) + " has " + prevTotal + " dots. Add a row of " + n + " dots to get Tower " + n + "."],
      explain: "Triangular numbers grow by one extra row each time. Tower " + n + " = 1+2+...+" + n + " = " + answer + " dots." };
  }
  function genAngleType() {

    if (q.type === 'number') {
      document.getElementById('checkBtn').addEventListener('click', function () {
        var val = document.getElementById('numInput').value.trim();
        if (val === '') return;
        handleResult(Number(val) === Number(q.answer), null);
      });
      document.getElementById('numInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('checkBtn').click(); });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function (btn) {
        btn.addEventListener('click', function () {
          var idx = Number(btn.getAttribute('data-idx'));
          handleResult(q.choices[idx].value === q.answer, btn);
        });
      });
    }
  }

  function renderChapterComplete(i) {
    var c = state.chapters[i], meta = CHAPTERS_META[i];
    var totalStars = c.stars[0] + c.stars[1];
    var recap = c.questions.map(function (q, qi) {
      return '<div class="recap-item"><div class="q-prompt">' + q.prompt + '</div>' +
        '<div>Answer: <strong>' + q.answer + '</strong></div>' +
        '<div class="fb-explain">' + q.explain + '</div>' +
        '<div class="stars">' + starString(c.stars[qi]) + '</div></div>';
    }).join('');
    var isLast = i === 9;
    mainEl.innerHTML =
      '<button class="back-link" id="backBtn">← Back to dashboard</button>' +
      '<section class="summary-card">' +
      '<p class="kicker">Chapter ' + (i + 1) + ' of 10 complete</p>' +
      '<h2>' + meta.emoji + ' ' + meta.title + '</h2>' +
      '<div class="summary-total">' + totalStars + ' / 6 stars</div>' +
      recap +
      '<div class="nav-row">' +
      '<button class="ghost-btn" id="replayBtn">🔄 Replay this chapter</button>' +
      (!isLast ? '<button class="primary-btn" id="nextChBtn">Next chapter →</button>' : '') +
      '</div></section>';
    document.getElementById('backBtn').addEventListener('click', renderDashboard);
    document.getElementById('replayBtn').addEventListener('click', function () {
      state.chapters[i] = freshChapter(i); saveState(); enterChapter(i);
    });
    if (!isLast) {
      document.getElementById('nextChBtn').addEventListener('click', function () { enterChapter(i + 1); });
    }
  }

  function launchConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors = ['#D9A22B', '#167A67', '#C23B56', '#3F6FB0'];
    for (var k = 0; k < 16; k++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + 'vw';
      piece.style.background = colors[k % colors.length];
      piece.style.animationDelay = (Math.random() * 150) + 'ms';
      document.body.appendChild(piece);
      (function (el) { setTimeout(function () { el.remove(); }, 1400); })(piece);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    mainEl = document.getElementById('main');
    document.getElementById('homeBtn').addEventListener('click', renderDashboard);
    document.getElementById('resetBtn').addEventListener('click', function () {
      if (window.confirm('Reset all progress across all 10 chapters? This cannot be undone.')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        initGame(true);
      }
    });
    if (LP_TOKEN && LP_ROLE) {
      var actions = document.querySelector('.topbar-actions');
      var back = document.createElement('a');
      back.className = 'ghost-btn'; back.textContent = '← My portal'; back.style.textDecoration = 'none';
      back.href = LP_ROLE === 'student' ? '/student.html' : (LP_ROLE === 'parent' ? '/parent.html' : '/teacher.html');
      actions.insertBefore(back, actions.firstChild);
    }
    initGame(false);
    var m = /[?&]chapter=(\d+)/.exec(location.search);
    if (m) {
      var ci = Number(m[1]) - 1;
      if (ci >= 0 && ci < 10) {
        var cc = state.chapters[ci];
        if (cc.answered[0] && cc.answered[1]) renderChapterComplete(ci); else enterChapter(ci);
      }
    }
  });
})();
</script>
</body>
</html>
